services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finder
      POSTGRES_PASSWORD: finder
      POSTGRES_DB: finder
    ports:
      - "5432:5432"
    volumes:
      - finder_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finder -d finder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://finder:finder@db:5432/finder
      MILLIONVERIFIER_API_KEY: ${MILLIONVERIFIER_API_KEY:-}
      NO2BOUNCE_API_KEY: ${NO2BOUNCE_API_KEY:-}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-5}
      DEFAULT_COST_CEILING: ${DEFAULT_COST_CEILING:-25}
    ports:
      - "8000:8000"

volumes:
  finder_pg:
